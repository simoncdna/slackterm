[package]
name = "slackterm"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = { version = "0.29", features = ["event-stream"] }
directories = "6.0.0"
emojis = "0.9.0"
futures-util = "0.3.34"
keyring = "4.2.0"
ratatui = "0.30.2"
reqwest = { version = "0.13.5", default-features = false, features = ["form", "json", "rustls"] }
rpassword = "7.5.4"
rustls = { version = "0.23.45", default-features = false, features = ["aws-lc-rs", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["full"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-native-roots"] }
toml = "1.1.7"
unicode-width = "0.2.2"

[dev-dependencies]
tempfile = "3.27.0"
wiremock = "0.6.5"
