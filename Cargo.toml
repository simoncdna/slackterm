[package]
name = "slackterm"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
description = "Slack in your terminal: real time, threads, search and sections, all from the keyboard"
license = "MIT OR Apache-2.0"
repository = "https://github.com/simoncdna/slackterm"
homepage = "https://github.com/simoncdna/slackterm"
readme = "README.md"
keywords = ["slack", "tui", "terminal", "chat", "cli"]
categories = ["command-line-utilities"]
# The README videos would weigh more than the crate itself.
exclude = ["docs/", ".github/", "dist-workspace.toml"]

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = "4.6.11"
crossterm = "0.29"
directories = "6.0.0"
emojis = "0.9.0"
futures-util = "0.3.34"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
keyring = "4.2.0"
open = "5.4.4"
ratatui = "0.30.2"
ratatui-image = { version = "11.1.0", default-features = false, features = ["crossterm", "image-defaults"] }
reqwest = { version = "0.13.5", default-features = false, features = ["form", "json", "rustls"] }
rpassword = "7.5.4"
rustls = { version = "0.23.45", default-features = false, features = ["aws-lc-rs", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["full"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-native-roots"] }
toml = "1.1.7"
toml_edit = "0.25.17"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
unicode-width = "0.2.2"

[dev-dependencies]
tempfile = "3.27.0"
wiremock = "0.6.5"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
