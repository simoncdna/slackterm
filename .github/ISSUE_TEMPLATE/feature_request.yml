name: Feature request
description: Something you would like slackterm to do
labels: [enhancement]
body:
  - type: textarea
    id: what
    attributes:
      label: What you would like to do
      description: The task, rather than the solution, e.g. "find the threads I was mentioned in this week".
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How you do it today
      description: In Slack's own app, or with slackterm as it is.
  - type: textarea
    id: idea
    attributes:
      label: An idea of how it could work
      description: Keys, where it would show, anything you have in mind. Optional.
